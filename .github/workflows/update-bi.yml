name: Atualizar BI GEJA

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update-bi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install gspread google-auth cryptography -q

      - name: Buscar dados do Google Sheets e gerar payload
        env:
          GEJA_SA_KEY: ${{ secrets.GEJA_SA_KEY }}
        run: python build_bi.py

      - name: Injetar dados no HTML e publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python push_bi.py
