name: Validar Inadimplentes

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth -q
      - name: Validar e salvar resultado
        env:
          GEJA_SA_KEY: ${{ secrets.GEJA_SA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python validar_inad.py
