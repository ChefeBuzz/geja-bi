name: Validar Inadimplentes

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth -q
      - name: Validar dados ao vivo
        env:
          GEJA_SA_KEY: ${{ secrets.GEJA_SA_KEY }}
        run: python validar_inad.py
      - name: Salvar resultado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: validacao-resultado
          path: validacao_resultado.json
          retention-days: 1
